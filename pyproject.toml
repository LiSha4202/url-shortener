[project]
name = "project-fastapi"
version = "0.1.0"
description = "no-description"
authors = [
    {name = "liSha4202",email = "dr.aleksandr-sirotin@yandex.ru"}
]
license = "-"
requires-python = ">=3.13"
dependencies = [
