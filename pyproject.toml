    "pydantic[email] (>=2.13.4,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "sqlalchemy[asyncio] (>=2.0.51,<3.0.0)",
    "aiohttp (>=3.14.1,<4.0.0)",
    "alembic[sqlalchemy] (>=1.18.5,<2.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "passlib[argon2] (>=1.7.4,<2.0.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "user-agents (>=2.2.0,<3.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
