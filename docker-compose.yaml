services:

  app:
    build:
      context: ./
      dockerfile: ./Dockerfile
    environment:
      APP_CONFIG__DB__URL: postgresql+asyncpg://user:password@localhost:5432/shortener
    ports:
      - "8000:8000"
    depends_on:
      - pg

  pg:
    image: postgres
    command: "-c listen_addresses='*'"
    environment:
      POSTGRES_DB: shortener
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.org
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"

volumes:
  postgres_data: