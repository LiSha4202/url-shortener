events {
    worker_connections 1024;
}

http {
    # Основные настройки (можно добавить gzip, таймауты и т.д.)
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    resolver 127.0.0.11 valid=5s ipv6=off;

    # Логи (опционально)
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    upstream backend {
        # Имя сервиса из docker-compose и порт, который слушает FastAPI внутри контейнера
        server app:8000;
    }

    server {
        listen 80;
        server_name localhost;  

        # Отдача статики (если есть)
        location /static/ {
            alias /usr/share/nginx/html/static/;
            expires 30d;
        }

        # Проксирование всех остальных запросов в FastAPI
        location / {
            set $backend_upstream http://app:8000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Таймауты (опционально)
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}